<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Գեղեցիկ ապրելու արվեստը</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ground:#1c130d; --ground-2:#3a2617; --gold:#d8b46a; --gold-dim:#9c7b3c;
    --leather:#5a2a17; --leather-dark:#2e130a; --paper:#f6ead0; --paper-2:#ead6ae; --ink:#f3e6c9;
    --pw:180px; --ph:265px; --oh:13px;
  }
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--ground); color:var(--ink);
    font-family:"Noto Serif Armenian", Georgia, "Times New Roman", serif;
    padding-inline:16px; box-sizing:border-box;
  }
  .stage{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 45%, #5b3d24 0%, var(--ground-2) 45%, var(--ground) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .stage::after{ /* faint wood-grain / dust */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.18;
    background:repeating-linear-gradient(97deg, rgba(0,0,0,.25) 0 2px, transparent 2px 9px);
    mix-blend-mode:multiply;
  }
  .book{
    position:relative; width:calc(var(--pw)*2); height:var(--ph);
    perspective:calc(var(--pw)*9); perspective-origin:50% 40%;
    transform:translateX(calc(var(--pw) * -0.5)) scale(var(--closed-scale,1));
    transition:transform 1.7s cubic-bezier(.55,.05,.25,1);
    z-index:1;
  }
  .book.open{ transform:none; }
  .floor-shadow{
    position:absolute; left:calc(var(--pw)*.15); right:calc(var(--pw)*-.1); bottom:calc(var(--oh)*-2.6);
    height:calc(var(--oh)*3); border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.65), transparent);
    filter:blur(6px); transition:left 1.7s ease;
  }
  .book.open .floor-shadow{ left:calc(var(--pw)*-.12); }

  /* boards (hard covers) */
  .board{
    position:absolute; top:calc(var(--oh)*-1); height:calc(var(--ph) + var(--oh)*2);
    width:calc(var(--pw) + var(--oh)); left:var(--pw);
    border-radius:0 6px 6px 0;
    background:linear-gradient(90deg, var(--leather-dark), var(--leather) 12%, #6b331c 60%, var(--leather-dark));
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }

  /* page blocks */
  .block{
    position:absolute; top:0; width:var(--pw); height:var(--ph);
  }
  .block.right{ left:var(--pw); z-index:2; }
  .block.left{ left:0; z-index:4; opacity:0; transition:opacity .45s ease; }
  .book.landed .block.left{ opacity:1; }

  .page{
    position:absolute; inset:0; overflow:hidden;
  }
  .page.r{
    border-radius:0 4px 4px 0;
    background:
      linear-gradient(90deg, rgba(110,70,30,.55) 0%, rgba(150,105,55,.22) 4%, transparent 14%),
      linear-gradient(90deg, var(--paper-2) 0%, var(--paper) 30%, #f9f0dc 55%, var(--paper-2) 100%);
  }
  .page.l{
    border-radius:4px 0 0 4px;
    background:
      linear-gradient(270deg, rgba(110,70,30,.55) 0%, rgba(150,105,55,.22) 4%, transparent 14%),
      linear-gradient(270deg, var(--paper-2) 0%, var(--paper) 30%, #f9f0dc 55%, var(--paper-2) 100%);
  }
  /* curved-paper highlight near the top & bottom edges */
  .page::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 8%, transparent 92%, rgba(90,55,20,.18));
  }

  /* page images */
  .pimg{
    position:absolute; left:calc(var(--pw)*.08); right:calc(var(--pw)*.08);
    top:50%; transform:translateY(-50%); aspect-ratio:0.86; /* same box for both pages */
    background-repeat:no-repeat; background-position:center; background-size:cover;
    mix-blend-mode:multiply;
  }
  .pimg.p1{ background-image:url("images/page1.jpg"); }
  .pimg.p2{ background-image:url("images/page2.jpg"); }

  /* leaves */
  .leaf{
    position:absolute; left:var(--pw); top:0; width:var(--pw); height:var(--ph);
    transform-origin:left center; transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.45,.05,.3,1);
  }
  .leaf.flipped{ transform:rotateY(-180deg); }
  .leaf .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .leaf .face.back{ transform:rotateY(180deg); }
  .leaf .face::before{ /* moving shade while turning */
    content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.28), transparent 70%);
    opacity:0; transition:opacity .55s ease;
  }
  .leaf.turning .face::before{ opacity:1; }

  .leaf.cover{
    top:calc(var(--oh)*-1); width:calc(var(--pw) + var(--oh)); height:calc(var(--ph) + var(--oh)*2);
    transition:transform 1.6s cubic-bezier(.6,.02,.28,1);
  }
  .cover .front{
    border-radius:0 7px 7px 0; overflow:hidden;
    background:
      linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(255,220,170,.10) 3%, rgba(0,0,0,.35) 6.5%, transparent 9%),
      radial-gradient(ellipse at 35% 25%, #7a3c20 0%, var(--leather) 45%, #3a170b 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 calc(var(--pw)*.12) rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.6);
  }
  .cover .front::after{ /* leather grain */
    content:""; position:absolute; inset:0; opacity:.22; pointer-events:none;
    background:
      repeating-radial-gradient(circle at 30% 40%, rgba(0,0,0,.5) 0 1px, transparent 1px 3px),
      repeating-radial-gradient(circle at 70% 70%, rgba(255,255,255,.2) 0 1px, transparent 1px 4px);
  }
  .frame{
    position:absolute; left:calc(var(--pw)*.14); right:calc(var(--pw)*.08);
    top:calc(var(--oh) + var(--ph)*.06); bottom:calc(var(--oh) + var(--ph)*.06);
    border:2px solid var(--gold); border-radius:4px;
    box-shadow:0 0 0 4px transparent, 0 0 0 5px var(--gold-dim), inset 0 0 0 4px transparent, inset 0 0 0 5px var(--gold-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--ph)*.05);
  }
  .orn{ width:42%; height:calc(var(--ph)*.03); color:var(--gold); }
  .orn svg{ width:100%; height:100%; display:block; }
  .cover-img{
    width:88%; aspect-ratio:793/595; border-radius:3px;
    background:url("images/cover.webp") center/cover no-repeat;
    box-shadow:0 0 0 2px var(--gold), 0 0 0 4px #3a170b, 0 0 0 5px var(--gold-dim), 0 6px 14px rgba(0,0,0,.55);
  }
  .sheen{
    position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:inherit;
  }
  .sheen::before{
    content:""; position:absolute; top:-20%; bottom:-20%; width:35%; left:-60%;
    background:linear-gradient(100deg, transparent, rgba(255,230,180,.18), transparent);
    transform:skewX(-12deg); animation:sheen 2.2s .3s ease-in-out 1 both;
  }
  @keyframes sheen{ to{ left:130%; } }
  .cover .back{
    border-radius:7px 0 0 7px; overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(160,40,30,.55), transparent 22%),
      radial-gradient(circle at 70% 60%, rgba(30,60,110,.5), transparent 25%),
      radial-gradient(circle at 40% 85%, rgba(200,150,60,.5), transparent 22%),
      radial-gradient(circle at 85% 15%, rgba(40,90,70,.5), transparent 24%),
      #7b2d1e;
    box-shadow:inset 0 0 0 calc(var(--oh)*.7) var(--leather);
  }

  @media (prefers-reduced-motion: reduce){
    .book, .leaf, .leaf.cover, .floor-shadow{ transition-duration:.01s !important; }
    .sheen::before{ animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book">
    <div class="floor-shadow"></div>
    <div class="board"></div>
    <div class="block right" id="rightBlock"><div class="page r"><div class="pimg p2"></div></div></div>
    <div class="block left" id="leftBlock"><div class="page l"></div></div>
    <!-- leaves are generated by script -->
    <div class="leaf cover" id="cover">
      <div class="face front">
        <div class="frame">
          <div class="orn" aria-hidden="true"><svg viewBox="0 0 120 10"><path d="M0 5h48M72 5h48" stroke="currentColor" stroke-width="1"/><path d="M60 0l6 5-6 5-6-5z" fill="currentColor"/><circle cx="50" cy="5" r="1.6" fill="currentColor"/><circle cx="70" cy="5" r="1.6" fill="currentColor"/></svg></div>
          <div class="cover-img" role="img" aria-label="Գեղեցիկ ապրելու արվեստը"></div>
          <div class="orn" aria-hidden="true"><svg viewBox="0 0 120 10"><path d="M0 5h48M72 5h48" stroke="currentColor" stroke-width="1"/><path d="M60 0l6 5-6 5-6-5z" fill="currentColor"/><circle cx="50" cy="5" r="1.6" fill="currentColor"/><circle cx="70" cy="5" r="1.6" fill="currentColor"/></svg></div>
        </div>
        <div class="sheen"></div>
      </div>
      <div class="face back"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const book = document.getElementById('book');
  const cover = document.getElementById('cover');
  const LEAVES = 6;
  const leaves = [];
  let timers = [];

  // build the inner leaves (top-most first in flip order)
  for (let i = 0; i < LEAVES; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    const last = i === LEAVES - 1;
    leaf.innerHTML =
      '<div class="face front page r"></div>' +
      '<div class="face back page l">' + (last ? '<div class="pimg p1"></div>' : '') + '</div>';
    book.insertBefore(leaf, cover);
    leaves.push(leaf);
  }

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = Math.floor(Math.min((vw - 24) / 2.14, (vh * 0.86) / 1.62, 470));
    const ph = Math.round(pw * 1.47);
    const oh = Math.round(pw * 0.07);
    const r = document.documentElement.style;
    r.setProperty('--pw', pw + 'px');
    r.setProperty('--ph', ph + 'px');
    r.setProperty('--oh', oh + 'px');
    // closed book: enlarge the cover so it fills the screen nicely
    const sc = Math.max(1, Math.min((vw - 40) / (pw + oh), (vh * 0.8) / (ph + 2 * oh), 1.9));
    r.setProperty('--closed-scale', sc.toFixed(3));
    // thick page edges, fanning outward like a real block of paper
    const step = Math.max(0.8, pw / 170);
    const n = 11, edgeR = [], edgeL = [];
    for (let k = 1; k <= n; k++) {
      const c = k % 2 ? '#efe0bf' : '#c7a978';
      const x = (k * step).toFixed(1), y = (k * step * 0.35).toFixed(1);
      edgeR.push(`${x}px ${y}px 0 ${c}`);
      edgeL.push(`-${x}px ${y}px 0 ${c}`);
    }
    edgeR.push(`${(n + 2) * step}px ${(n + 3) * step * .35}px ${step * 6}px rgba(0,0,0,.35)`);
    edgeL.push(`-${(n + 2) * step}px ${(n + 3) * step * .35}px ${step * 6}px rgba(0,0,0,.35)`);
    document.getElementById('rightBlock').style.boxShadow = edgeR.join(',');
    document.getElementById('leftBlock').style.boxShadow = edgeL.join(',');
  }

  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    book.classList.remove('open', 'landed');
    const all = [cover, ...leaves];
    all.forEach(el => { el.style.transition = 'none'; el.classList.remove('flipped', 'turning'); });
    cover.style.zIndex = 50;
    leaves.forEach((l, i) => l.style.zIndex = 40 - i);
    void book.offsetWidth;
    all.forEach(el => el.style.transition = '');
  }

  function flip(el, durMs, leftZ) {
    el.style.zIndex = 70;
    el.classList.add('flipped', 'turning');
    later(() => { el.style.zIndex = leftZ; }, durMs * 0.5);
    later(() => el.classList.remove('turning'), durMs * 0.85);
  }

  function play() {
    reset();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const COVER_MS = reduce ? 10 : 1600, LEAF_MS = reduce ? 10 : 1150, GAP = reduce ? 0 : 150;
    later(() => {
      book.classList.add('open');
      flip(cover, COVER_MS, 3);
      later(() => book.classList.add('landed'), COVER_MS * 0.9);
      leaves.forEach((leaf, i) => later(() => flip(leaf, LEAF_MS, 10 + i), (reduce ? 0 : 520) + i * GAP));
    }, 3000); // cover stays closed for 2 seconds
  }

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
  layout();
  play();
})();
</script>
</body>
</html>
